<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive Cost — Rental Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #111116;
    --surface: #1c1c24;
    --surface-hover: #22222c;
    --border: #2e2e3a;
    --gold: #c9a96e;
    --gold-dim: #8a6f44;
    --text: #f0efe9;
    --text-muted: #7a7a8a;
    --text-dim: #4a4a5a;
    --green: #6bcfa0;
    --radius: 14px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 400;
    color: var(--text);
    line-height: 1.15;
  }

  h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .subtitle {
    margin-top: 10px;
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 300;
    letter-spacing: 0.01em;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    max-width: 880px;
    margin: 0 auto;
    align-items: start;
  }

  @media (max-width: 680px) {
    .layout { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 22px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 7px;
    letter-spacing: 0.02em;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-unit {
    position: absolute;
    right: 14px;
    font-size: 12px;
    color: var(--text-dim);
    pointer-events: none;
    font-weight: 500;
  }

  input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 44px 11px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    outline: none;
    transition: border-color 0.18s, box-shadow 0.18s;
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  input[type="number"]:focus {
    border-color: var(--gold-dim);
    box-shadow: 0 0 0 3px rgba(201,169,110,0.08);
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 22px 0;
  }

  /* Summary card */
  .summary-card {
    position: sticky;
    top: 24px;
  }

  .line-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }

  .line-item:last-of-type { border-bottom: none; }

  .line-label {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
  }

  .line-value {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    transition: color 0.2s;
  }

  .line-value.highlight { color: var(--gold); }

  .line-item.extra .line-label { color: var(--text-dim); font-size: 12px; }
  .line-item.extra .line-value { color: var(--text-muted); font-size: 12px; }

  .total-block {
    margin-top: 20px;
    padding: 18px;
    background: var(--bg);
    border-radius: 10px;
    border: 1px solid var(--gold-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .total-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .total-value {
    font-family: 'Playfair Display', serif;
    font-size: 1.9rem;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    transition: all 0.25s;
  }

  .per-day {
    margin-top: 12px;
    text-align: right;
    font-size: 12px;
    color: var(--text-dim);
  }

  .per-day span {
    color: var(--text-muted);
  }

  .zero-state {
    text-align: center;
    padding: 30px 0;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.6;
  }

  .badge {
    display: inline-block;
    background: rgba(107,207,160,0.1);
    color: var(--green);
    border: 1px solid rgba(107,207,160,0.2);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .badge.warn {
    background: rgba(201,169,110,0.1);
    color: var(--gold);
    border-color: rgba(201,169,110,0.2);
  }

  .pulse {
    animation: pulse 0.3s ease;
  }

  @keyframes pulse {
    0% { opacity: 0.5; transform: scale(0.97); }
    100% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Rental Cost Calculator</p>
  <h1>How much will your<br><em>drive</em> really cost?</h1>
  <p class="subtitle">Enter your rental details and trip distance for a full breakdown.</p>
</header>

<div class="layout">

  <!-- INPUTS -->
  <div>
    <div class="card">
      <p class="section-label">Rental Terms</p>

      <div class="field">
        <label>Daily Rate</label>
        <div class="input-wrap">
          <input type="number" id="pricePerDay" placeholder="0.00" min="0" step="0.01">
          <span class="input-unit">/ day</span>
        </div>
      </div>

      <div class="field">
        <label>Free KM Included Per Day</label>
        <div class="input-wrap">
          <input type="number" id="freeKmPerDay" placeholder="100" min="0" step="1">
          <span class="input-unit">km</span>
        </div>
      </div>

      <div class="field">
        <label>Extra KM Charge (after free allowance)</label>
        <div class="input-wrap">
          <input type="number" id="pricePerExtraKm" placeholder="0.00" min="0" step="0.01">
          <span class="input-unit">/ km</span>
        </div>
      </div>

      <div class="divider"></div>
      <p class="section-label">Your Trip</p>

      <div class="field">
        <label>Number of Days</label>
        <div class="input-wrap">
          <input type="number" id="numDays" placeholder="0" min="1" step="1">
          <span class="input-unit">days</span>
        </div>
      </div>

      <div class="field">
        <label>Total Distance Driven</label>
        <div class="input-wrap">
          <input type="number" id="numKm" placeholder="0" min="0" step="1">
          <span class="input-unit">km</span>
        </div>
      </div>

      <div class="divider"></div>
      <p class="section-label">Fuel</p>

      <div class="field">
        <label>Fuel Consumption</label>
        <div class="input-wrap">
          <input type="number" id="fuelConsumption" placeholder="0.0" min="0" step="0.1">
          <span class="input-unit">km/L</span>
        </div>
      </div>

      <div class="field">
        <label>Fuel Price</label>
        <div class="input-wrap">
          <input type="number" id="fuelPrice" placeholder="0.00" min="0" step="0.01">
          <span class="input-unit">/ L</span>
        </div>
      </div>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="summary-card">
    <div class="card">
      <p class="section-label">Cost Breakdown</p>
      <div id="summary">
        <div class="zero-state">Fill in your rental details<br>to see the cost breakdown.</div>
      </div>
    </div>
  </div>

</div>

<script>
  const ids = ['pricePerDay','freeKmPerDay','pricePerExtraKm','numDays','numKm','fuelConsumption','fuelPrice'];
  ids.forEach(id => document.getElementById(id).addEventListener('input', calculate));

  function fmt(n) {
    return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function calculate() {
    const v = id => parseFloat(document.getElementById(id).value) || 0;

    const pricePerDay     = v('pricePerDay');
    const freeKmPerDay    = v('freeKmPerDay');
    const pricePerExtraKm = v('pricePerExtraKm');
    const numDays         = v('numDays');
    const numKm           = v('numKm');
    const fuelConsumption = v('fuelConsumption');
    const fuelPrice       = v('fuelPrice');

    const hasEnough = pricePerDay > 0 && numDays > 0;
    if (!hasEnough) {
      document.getElementById('summary').innerHTML =
        '<div class="zero-state">Fill in your rental details<br>to see the cost breakdown.</div>';
      return;
    }

    // Calculations
    const rentalBase    = pricePerDay * numDays;
    const totalFreeKm   = freeKmPerDay * numDays;
    const extraKm       = Math.max(0, numKm - totalFreeKm);
    const extraKmCost   = extraKm * pricePerExtraKm;

    const litersNeeded  = fuelConsumption > 0 ? numKm / fuelConsumption : 0;
    const fuelCost      = litersNeeded * fuelPrice;

    const totalCost     = rentalBase + extraKmCost + fuelCost;
    const costPerDay    = numDays > 0 ? totalCost / numDays : 0;
    const costPerKm     = numKm > 0 ? totalCost / numKm : 0;

    const kmStatus = numKm <= totalFreeKm
      ? `<span class="badge">Within free KMs</span>`
      : `<span class="badge warn">+${Math.round(extraKm)} extra km</span>`;

    let html = `
      <div class="line-item">
        <span class="line-label">Base Rental (${numDays} day${numDays>1?'s':''})</span>
        <span class="line-value">${fmt(rentalBase)}</span>
      </div>

      <div class="line-item extra">
        <span class="line-label">Free KM Allowance</span>
        <span class="line-value">${Math.round(totalFreeKm).toLocaleString()} km total</span>
      </div>

      <div class="line-item extra">
        <span class="line-label">Distance Driven ${kmStatus}</span>
        <span class="line-value">${Math.round(numKm).toLocaleString()} km</span>
      </div>
    `;

    if (extraKm > 0) {
      html += `
      <div class="line-item">
        <span class="line-label">Extra KM Charge (${Math.round(extraKm).toLocaleString()} km)</span>
        <span class="line-value highlight">${fmt(extraKmCost)}</span>
      </div>
      `;
    }

    if (fuelCost > 0) {
      html += `
      <div class="line-item extra">
        <span class="line-label">Fuel needed (~${fmt(litersNeeded)} L)</span>
        <span class="line-value">${Math.round(numKm).toLocaleString()} km ÷ ${fuelConsumption} km/L</span>
      </div>
      <div class="line-item">
        <span class="line-label">Fuel Cost</span>
        <span class="line-value">${fmt(fuelCost)}</span>
      </div>
      `;
    }

    html += `
      <div class="total-block">
        <span class="total-label">Total Cost</span>
        <span class="total-value">${fmt(totalCost)}</span>
      </div>
      <p class="per-day">
        <span>${fmt(costPerDay)} / day</span>
        ${numKm > 0 ? ` &nbsp;·&nbsp; <span>${fmt(costPerKm)} / km</span>` : ''}
      </p>
    `;

    const el = document.getElementById('summary');
    el.innerHTML = html;
    el.querySelectorAll('.total-value, .line-value').forEach(e => {
      e.classList.remove('pulse');
      void e.offsetWidth;
      e.classList.add('pulse');
    });
  }
</script>
</body>
</html>
