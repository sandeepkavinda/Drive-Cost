<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drive Cost — Rental Calculator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231c1c24'/><text y='46' x='8' font-size='40'>🚗</text></svg>"
    />
    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <p class="eyebrow">Rental Cost Calculator</p>
      <h1>How much will your<br /><em>drive</em> really cost?</h1>
      <p class="subtitle">Pick a vehicle or enter details manually.</p>
    </header>

    <!-- Vehicle chips -->
    <div class="vehicle-section">
      <p class="section-label" style="margin-bottom: 12px">Select Vehicle</p>
      <div class="vehicle-chips" id="vehicleChips"></div>
    </div>

    <div class="layout">
      <!-- INPUTS -->
      <div>
        <div class="card">
          <p class="section-label">Rental Terms</p>

          <div class="field">
            <label>Daily Rate</label>
            <div class="input-wrap">
              <input
                type="number"
                id="pricePerDay"
                placeholder="0.00"
                min="0"
                step="0.01"
              />
              <span class="input-unit">/ day</span>
            </div>
          </div>

          <div class="field">
            <label>Free KM Included Per Day</label>
            <div class="input-wrap">
              <input
                type="number"
                id="freeKmPerDay"
                placeholder="100"
                min="0"
                step="1"
                value="100"
              />
              <span class="input-unit">km</span>
            </div>
          </div>

          <div class="field">
            <label>Extra KM Charge (after free allowance)</label>
            <div class="input-wrap">
              <input
                type="number"
                id="pricePerExtraKm"
                placeholder="0.00"
                min="0"
                step="0.01"
              />
              <span class="input-unit">/ km</span>
            </div>
          </div>

          <div class="divider"></div>
          <p class="section-label">Your Trip</p>

          <div class="field">
            <label>Number of Days</label>
            <div class="input-wrap">
              <input
                type="number"
                id="numDays"
                placeholder="0"
                min="1"
                step="1"
                value="1"
              />
              <span class="input-unit">days</span>
            </div>
          </div>

          <div class="field">
            <label>Total Distance Driven</label>
            <div class="input-wrap">
              <input
                type="number"
                id="numKm"
                placeholder="0"
                min="0"
                step="1"
              />
              <span class="input-unit">km</span>
            </div>
          </div>

          <div class="divider"></div>
          <p class="section-label">Fuel</p>

          <div class="field">
            <label>Fuel Consumption</label>
            <div class="input-wrap">
              <input
                type="number"
                id="fuelConsumption"
                placeholder="0.0"
                min="0"
                step="0.1"
              />
              <span class="input-unit">km/L</span>
            </div>
          </div>

          <div class="field">
            <label>Fuel Price</label>
            <div class="input-wrap">
              <input
                type="number"
                id="fuelPrice"
                placeholder="0.00"
                min="0"
                step="0.01"
              />
              <span class="input-unit">/ L</span>
            </div>
          </div>
        </div>
      </div>

      <!-- SUMMARY -->
      <div class="summary-card">
        <div class="card">
          <p class="section-label">Cost Breakdown</p>
          <div class="active-vehicle-tag" id="activeVehicleTag"></div>
          <div id="summary">
            <div class="zero-state">
              Fill in your rental details<br />to see the cost breakdown.
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile sticky total bar -->
    <div class="sticky-total" id="stickyTotal">
      <div>
        <div class="sticky-total-label">Total Cost</div>
        <div class="sticky-total-sub" id="stickyTotalSub"></div>
      </div>
      <div class="sticky-total-amount" id="stickyTotalAmount">—</div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
